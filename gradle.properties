# Project-wide Gradle settings.
# JVM args: force IPv4 loopback (localhost resolves to ::1 on this machine, which
# breaks the Gradle client<->daemon connection), and give the daemon enough heap.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Use AndroidX (not the legacy Support Library).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Generate per-module R classes (smaller, faster builds).
android.nonTransitiveRClass=true

# Run Gradle tasks in parallel where possible.
org.gradle.parallel=true

# Cache build outputs for faster incremental builds.
org.gradle.caching=true

# android.suppressUnsupportedCompileSdk intentionally REMOVED (was =35 under AGP 8.5.2).
# AGP 8.13 officially supports compileSdk 36, so the warning it silenced no longer
# exists. Do not reintroduce this flag to force a compileSdk the AGP has not been
# tested against — bump AGP instead (that is what the annual February gate is for).
